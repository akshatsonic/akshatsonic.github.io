name: Android APK

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || TAG="app-v0-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk writer.apk
          gh release create "$TAG" writer.apk --title "Writer $TAG" --notes "Android APK. Install on your phone and allow installs from unknown sources." || gh release upload "$TAG" writer.apk --clobber
